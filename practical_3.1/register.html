<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>StudentHub - Register</title>
</head>

<body>

    <header>

        <div class="logo-area">

            <img src="charusat_logo.jpg" alt="StudentHub Logo">

            <div>
                <h1>StudentHub</h1>
                <p>Your Smart Student Management Portal</p>
            </div>

        </div>

    </header>


    <nav>

        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="register.html">Register</a>
        <a href="login.html">Login</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="faculty.html">Faculty</a>
        <a href="events.html">Events</a>
        <a href="profile.html">Profile</a>
        <a href="contact.html">Contact</a>
        <a href="admin.html">Admin</a>
        <a href="faq.html">FAQ</a>
        <a href="feedback.html">Feedback</a>

    </nav>


    <main>

        <section class="page-title">

            <h2>Student Registration</h2>

            <p>
                Create your StudentHub account
            </p>

        </section>


        <section class="form-container">

            <form>

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name">
                </div>


                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email">
                </div>


                <div class="form-group">
                    <label for="roll">Roll Number</label>
                    <input type="text" id="roll" placeholder="Enter roll number">
                </div>


                <div class="form-group">
                    <label for="course">Course</label>

                    <select id="course">

                        <option>Select Course</option>
                        <option>B.Tech IT</option>
                        <option>B.Tech CSE</option>
                        <option>B.Tech CE</option>

                    </select>

                </div>


                <div class="form-group">
                    <label for="password">Password</label>

                    <input type="password"
                           id="password"
                           placeholder="Enter password">

                </div>


                <button type="submit" class="button">
                    Register
                </button>

            </form>

        </section>

    </main>


    <footer>
        <p>© <span id="year"></span> StudentHub</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
