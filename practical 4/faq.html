<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StudentHub - FAQ</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header>

        <div class="logo-area">

            <img src="charusat_logo.jpg"
                 alt="CHARUSAT Logo">

            <div>

                <h1>StudentHub</h1>

                <p>
                    Student Management System
                </p>

            </div>

        </div>


        <!-- Navigation -->

        <nav>

            <button class="hamburger"
                    onclick="toggleMenu()">

                ☰

            </button>


            <div class="nav-links"
                 id="navLinks">

                <a href="index.html">
                    Home
                </a>

                <a href="#">
                    About
                </a>

                <a href="#">
                    Register
                </a>

                <a href="#">
                    Login
                </a>

                <a href="#">
                    Dashboard
                </a>

                <a href="#">
                    Faculty
                </a>

                <a href="#">
                    Events
                </a>

                <a href="#">
                    Profile
                </a>

                <a href="#">
                    Contact
                </a>

                <a href="#">
                    Admin
                </a>

                <a href="faq.html">
                    FAQ
                </a>

                <a href="#">
                    Feedback
                </a>

            </div>


            <!-- Theme -->

            <button id="themeButton"
                    class="theme-button"
                    onclick="toggleTheme()">

                🌙 Dark Mode

            </button>

        </nav>

    </header>


    <!-- ================= FAQ ================= -->

    <main>

        <section class="faq-section">

            <h2>
                Frequently Asked Questions
            </h2>

            <p>
                Click on a question to expand or
                collapse the answer.
            </p>


            <!-- Search -->

            <div class="faq-search">

                <input
                    type="text"
                    id="faqSearch"
                    placeholder="Search FAQ..."
                >

            </div>


            <!-- Dynamic FAQ -->

            <div id="faqContainer">

                <p>
                    Loading FAQs...
                </p>

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © <span id="year"></span>
            StudentHub | CHARUSAT
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
